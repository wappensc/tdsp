# The workflows' actions are pinned to commit SHAs (a tag can be moved to other code;
# tools/ci-wiring.test.ts asserts the pins). Dependabot proposes new versions in a pull
# request, which touches .github/ and therefore waits for @wappensc/ci (.github/CODEOWNERS).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release younger than two weeks is not proposed: a compromised one is usually found
    # and withdrawn within days.
    cooldown:
      default-days: 14
    # Every action with a new version in one pull request. The updates change neighbouring
    # lines, so separate pull requests conflict: each merge has Dependabot rebase the others,
    # and the rebase dismisses the approval they already had.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    # Assigned to the developer, who assesses each update before @wappensc/ci reviews it
    # (CONTRIBUTING.md, "A Dependabot pull request").
    assignees:
      - wappensc-developer
