# Local/CI-only Synapse test homeserver. `./credentials` is
# generated by generate-config.ts (docker `generate` mode against the same
# pinned image) before this is brought up — see `matrix:up` in the root
# package.json for the full sequence. Federation is disabled and rate
# limits are loosened in that generated config, not here; this file only
# runs the already-configured server.
services:
  synapse:
    image: matrixdotorg/synapse:v1.159.0
    container_name: tdsp-matrix-testserver
    restart: unless-stopped
    ports:
      - "18008:8008"
    volumes:
      - ./credentials:/data
